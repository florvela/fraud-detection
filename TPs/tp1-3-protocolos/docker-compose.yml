services:
  grpc_service:
    build:
      context: ./grpc_service
    # host 50052 -> contenedor 50051 (el 50051 del host lo usa Multipass)
    ports:
      - "50052:50051"

  graphql_service:
    build:
      context: ./graphql_service
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=testpass
    depends_on:
      neo4j:
        condition: service_healthy

  # Neo4j para el linaje del TP2 (dato -> feature -> modelo). Si no está, el
  # campo `lineage` del GraphQL degrada a lista vacía (ver graphql_service/lineage.py).
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/testpass
    ports:
      - "7474:7474"   # navegador Neo4j
      - "7687:7687"   # bolt
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p testpass 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  rest_service:
    build:
      context: ./rest_service
    ports:
      - "8001:8001"

  # El cliente no arranca con `up`; se corre a demanda:
  #   docker compose run --rm client
  # Dentro de la red de Docker se conecta por NOMBRE de servicio (no localhost).
  client:
    build:
      context: ./client
    depends_on:
      - grpc_service
      - graphql_service
      - rest_service
    environment:
      - GRPC_HOST=grpc_service:50051
      - GRAPHQL_URL=http://graphql_service:8000/graphql
      - REST_URL=http://rest_service:8001/predict
    profiles:
      - client
