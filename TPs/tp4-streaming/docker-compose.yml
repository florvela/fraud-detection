# =============================================================================
# TP4 — Streaming (standalone y autocontenido). No depende del repo raíz:
# el modelo se hornea en la imagen (ver Dockerfile) y los eventos se generan
# sintéticos si no hay parquet, así que basta con esta carpeta.
#
#   cd TPs/tp4-streaming
#   docker compose up -d --build
#
# Levanta Redpanda (broker Kafka-compatible) + producer + consumer.
# =============================================================================

services:
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"

  stream-consumer:
    build:
      context: .
    command: ["python", "consumer.py", "--source", "kafka", "--bootstrap-servers", "redpanda:9092", "--window", "100"]
    depends_on: [redpanda]
    restart: on-failure

  stream-producer:
    build:
      context: .
    command: ["python", "producer.py", "--source", "kafka", "--bootstrap-servers", "redpanda:9092", "--total", "1000", "--rate", "200", "--drift-at", "0.5"]
    depends_on: [redpanda]
