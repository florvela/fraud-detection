[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.52.4"}
strawberry-graphql = {extras = ["fastapi"], version = "^0.327.3"}
scikit-learn = "^1.9.0"
xgboost = "^3.4.1"
numpy = "^2.5.2"
pandas = "^3.0.5"
joblib = "^1.6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
